# GitHub Pages Deploy & PR Preview
#
# Deploys static site artifacts to GitHub Pages:
#   - Push to main → deploys to / (root)
#   - Pull requests → deploys to /pr-{number}/ and posts a preview comment
#   - Closed pull requests → removes /pr-{number}/ from gh-pages
#
# Pull requests from forks get a read-only token, so they are skipped.
#
# Prerequisites:
#   1. Enable GitHub Pages: Settings → Pages → Source: "Deploy from a branch" → Branch: gh-pages
#   2. Customize `make build-site` to produce your project's artifacts
#
# The build contract is: `make build-site` produces output in $SITE_DIR (default: site/)

name: Pages Preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

env:
  SITE_DIR: site

jobs:
  # ===========================================================================
  # Build
  # ===========================================================================
  build:
    name: Build Site
    if: github.event.action != 'closed' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: make install-dev

      - name: Build site
        run: make build-site

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ env.SITE_DIR }}/

  # ===========================================================================
  # Deploy to root (main branch only)
  # ===========================================================================
  deploy-main:
    name: Deploy (main)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages (root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.SITE_DIR }}
          keep_files: true
          destination_dir: .

  # ===========================================================================
  # Deploy PR preview
  # ===========================================================================
  deploy-preview:
    name: Deploy Preview (PR)
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    environment:
      name: pr-preview
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages (PR subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.SITE_DIR }}
          keep_files: true
          destination_dir: pr-${{ github.event.number }}

      - name: Post or update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${context.issue.number}/`;
            const body = `${marker}\n**Preview:** ${previewUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ===========================================================================
  # Remove the PR preview when the pull request is closed or merged
  # ===========================================================================
  cleanup-preview:
    name: Remove Preview (PR closed)
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Remove preview directory
        env:
          PREVIEW_DIR: pr-${{ github.event.number }}
        run: |
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "No preview directory $PREVIEW_DIR, nothing to remove"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet "$PREVIEW_DIR"
          git commit --quiet -m "chore: remove preview for PR #${{ github.event.number }}"
          git push
