# GitHub Pages Deploy & PR Preview
#
# Deploys static site artifacts to GitHub Pages:
#   - Push to main → deploys to / (root)
#   - Pull requests → deploys to /pr-{number}/ and posts a preview comment
#   - Closed pull requests → removes /pr-{number}/ from gh-pages
#
# Pull requests from forks and from Dependabot get a read-only token, so they are skipped.
#
# Prerequisites:
#   1. Enable GitHub Pages: Settings → Pages → Source: "Deploy from a branch" → Branch: gh-pages
#   2. Customize `make build-site` to produce your project's artifacts
#
# The build contract is: `make build-site` produces output in $SITE_DIR (default: site/)

name: Pages Preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Read-only by default. The deploy and cleanup jobs ask for write access themselves,
# so the build job, which runs code from the pull request, cannot push.
permissions:
  contents: read

env:
  SITE_DIR: site

jobs:
  # ===========================================================================
  # Build
  # ===========================================================================
  build:
    name: Build Site
    if: github.event.action != 'closed' && (github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: make install-dev

      - name: Build site
        run: make build-site

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ env.SITE_DIR }}/

  # ===========================================================================
  # Deploy to root (main branch only)
  # ===========================================================================
  deploy-main:
    name: Deploy (main)
    permissions:
      contents: write
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    environment:
      name: github-pages
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages (root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.SITE_DIR }}
          keep_files: true
          destination_dir: .

  # ===========================================================================
  # Deploy PR preview
  # ===========================================================================
  deploy-preview:
    name: Deploy Preview (PR)
    permissions:
      contents: write
      pull-requests: write
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false

    environment:
      name: pr-preview
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/

    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: site
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages (PR subdirectory)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.SITE_DIR }}
          keep_files: true
          destination_dir: pr-${{ github.event.number }}

      - name: Post or update PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- pages-preview -->';
            const previewUrl = `https://${context.repo.owner}.github.io/${context.repo.repo}/pr-${context.issue.number}/`;
            const body = `${marker}\n**Preview:** ${previewUrl}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ===========================================================================
  # Remove the PR preview when the pull request is closed or merged
  # ===========================================================================
  cleanup-preview:
    name: Remove Preview (PR closed)
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Not in the gh-pages-deploy concurrency group: a group keeps only one
    # pending job, so a queued cleanup could be dropped. The push is retried instead.

    steps:
      - name: Remove preview directory from gh-pages
        env:
          PREVIEW_DIR: pr-${{ github.event.number }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if ! git ls-remote --exit-code --heads "$REPO_URL" gh-pages >/dev/null; then
            echo "No gh-pages branch yet, nothing to remove"
            exit 0
          fi
          git clone --quiet --depth 1 --branch gh-pages "$REPO_URL" pages
          cd pages
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "No preview directory $PREVIEW_DIR, nothing to remove"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -r --quiet "$PREVIEW_DIR"
          git commit --quiet -m "chore: remove preview $PREVIEW_DIR"
          for attempt in 1 2 3 4 5; do
            if git push --quiet; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing on the latest gh-pages"
            sleep $((attempt * 5))
            git pull --quiet --rebase
          done
          echo "Could not push the cleanup commit" >&2
          exit 1
