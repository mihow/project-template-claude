# Claude Code in GitHub
#
# Two jobs:
#   - mention: Claude responds when someone with write access writes @claude
#     in an issue, a pull request comment or a review comment
#   - review: Claude reviews each pull request before a human does (opt-in)
#
# Setup:
#   1. Add ONE of these repository secrets (Settings → Secrets and variables → Actions):
#        ANTHROPIC_API_KEY          - an Anthropic API key
#        CLAUDE_CODE_OAUTH_TOKEN    - a subscription token from `claude setup-token`
#      Running `/install-github-app` inside Claude Code does this for you.
#   2. To turn on automatic review, add the repository VARIABLE
#      CLAUDE_REVIEW with the value `true`.
#
# Without a secret the mention job fails when triggered; nothing else is affected.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  mention:
    name: Respond to @claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: make install-dev

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  review:
    name: Review pull request
    if: |
      github.event_name == 'pull_request' &&
      vars.CLAUDE_REVIEW == 'true' &&
      !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Read the diff with `gh pr diff` and the surrounding code. Report only
            correctness bugs, security problems and violations of AGENTS.md.
            Skip style that ruff already enforces. For each finding give the
            file, the line, a concrete failing scenario and a suggested fix.
            Post findings as inline review comments. If you find nothing, post
            one short comment saying so.
          claude_args: |
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob"
